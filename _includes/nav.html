<header class="nav">
  <div class="container nav__inner">
    <a class="nav__brand" href="{{ '/' | relative_url }}#top">
      <span class="nav__brand-title">{{ site.event.name }}</span>
      <span class="nav__brand-subtitle">{{ site.event.dates }} · {{ site.event.location_short }}</span>
    </a>

    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav__links" id="nav-links" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#program">Programme</a>
      <a href="#speakers">Speakers</a>
      <a href="#venue">Venue</a>
      <a href="#sponsors">Sponsors</a>
      <a href="#contact">Contact</a>
      {% if site.event.registration_open %}
        <a class="btn btn--small" href="{{ site.event.registration_url }}" target="_blank" rel="noopener">Register</a>
      {% endif %}
    </nav>
  </div>
</header>
